<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limulus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <path d="M11 2.5 18.5 6.75v8.5L11 19.5 3.5 15.25v-8.5z" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M7.6 11.1l2.5 2.5 4.3-5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <b>Limulus</b>
        <span>PAYMENT ASSURANCE</span>
      </div>
    </div>

    <select class="agent-select" id="agent-filter" aria-label="Filter by agent"></select>

    <nav id="nav"></nav>

    <div class="side-foot">
      Pre-product demo, example data.<br>
      <a href="/verify.html">Verify a receipt</a> · <a href="/index.html">Tamper demo</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="view-title">Overview</h1>
        <div class="sub" id="view-sub"></div>
      </div>
      <div class="actions">
        <span class="chip" id="rail-chip" title="Which payment rail is answering"><span class="led"></span><span id="rail-label">checking…</span></span>
        <span id="view-actions" class="actions"></span>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const get = (path) => fetch(path).then((r) => r.json()).catch(() => null);
const post = (path, body) =>
  fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then((r) => r.json()).catch(() => null);

const esc = (v) => String(v ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const money = (a, c) => `${c} ${Number(a).toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
const when = (iso) => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const LADDER = ["experimental", "shadow-ready", "human-supervised", "limited-autonomous", "expanded-autonomous"];

const state = { agent: "all", runs: [], scenarios: [], run: null, compare: { a: null, b: null }, traceScenario: null };

const VIEWS = [
  { group: "Monitor", id: "overview", title: "Overview", sub: "What the gate is doing, and what the Lab last found." },
  { group: "Monitor", id: "decisions", title: "Decisions", sub: "Every payment ruled on, with the signed receipt behind it." },
  { group: "Monitor", id: "outcomes", title: "Outcomes", sub: "What the rail actually did, checked against what we allowed." },
  { group: "Test", id: "runs", title: "Lab runs", sub: "Agents acting in a simulated world, graded on what they did rather than what they said." },
  { group: "Test", id: "scenarios", title: "Scenarios", sub: "Per-scenario results for the selected run, and the library behind them." },
  { group: "Test", id: "trace", title: "Episode trace", sub: "Every tool call, with each finding anchored to the call it was decided from." },
  { group: "Test", id: "compare", title: "Compare", sub: "Two runs side by side: what a change fixed, and what it broke." },
  { group: "Test", id: "qualifications", title: "Qualifications", sub: "What each agent is cleared to do on its own, and until when." },
  { group: "Configure", id: "keys", title: "API keys", sub: "Stored as hashes. The key itself is shown once and never again." },
  { group: "Configure", id: "webhooks", title: "Webhooks", sub: "Signed deliveries, and what we tried to send." },
];

function renderNav() {
  const groups = [...new Set(VIEWS.map((v) => v.group))];
  $("nav").innerHTML = groups.map((group) => `
    <div class="group">
      <h3>${group}</h3>
      ${VIEWS.filter((v) => v.group === group).map((v) =>
        `<a href="#/${v.id}" data-view="${v.id}"><span class="dot"></span>${v.title}</a>`).join("")}
    </div>`).join("");
}

function setActive(id) {
  for (const link of document.querySelectorAll("[data-view]")) link.classList.toggle("on", link.dataset.view === id);
  const view = VIEWS.find((v) => v.id === id) ?? VIEWS[0];
  $("view-title").textContent = view.title;
  $("view-sub").textContent = view.sub;
}

const track = (score) => {
  const grade = score >= 95 ? "" : score >= 70 ? "mid" : "low";
  return `<div class="track"><span class="${grade}" style="width:${Math.max(2, score)}%"></span></div>`;
};

const axisBlock = (name, dimension) => dimension === null || dimension === undefined
  ? `<div class="axis"><div class="name">${name}</div><div class="score faint">—</div>${track(0)}
     <div class="detail">Not measured: needs at least two trials per scenario.</div></div>`
  : `<div class="axis">
      <div class="name">${name}</div>
      <div class="score">${dimension.score}</div>
      ${track(dimension.score)}
      <div class="detail">${esc(dimension.detail)}</div>
    </div>`;

const ladderRow = (level) => {
  const at = LADDER.indexOf(level);
  return `<div class="ladder">${LADDER.map((rung, i) =>
    `<div class="rung ${i === at ? "current" : i < at ? "reached" : ""}" title="${rung}">${rung.replace("-", " ")}</div>`).join("")}</div>`;
};

const levelClass = (level) => level?.includes("autonomous") ? "ok" : level === "experimental" ? "bad" : "warn";
const pill = (value, cls) => `<span class="pill ${cls ?? value}">${esc(value)}</span>`;

const visibleRuns = () => state.agent === "all" ? state.runs : state.runs.filter((r) => r.agent.name === state.agent);

function latestPerAgent(runs) {
  const byAgent = new Map();
  for (const run of runs) byAgent.set(`${run.agent.name}@${run.agent.version}`, run);
  return [...byAgent.values()].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}

/**
 * With one agent in view its readiness is the headline. With several, a single
 * number would be whichever happened to run last, which is not a fact.
 */
function readinessCard(runs) {
  const latest = latestPerAgent(runs);
  if (latest.length === 0) return `<div class="empty">No runs yet.</div>`;

  if (latest.length === 1) {
    const run = latest[0];
    return `
      <div class="metric ${levelClass(run.axes.level)}">${run.axes.safety.score}</div>
      <div class="metric-label">safety · ${esc(run.agent.name)} v${esc(run.agent.version)}</div>
      <div style="margin-top:14px">${pill(run.axes.level, levelClass(run.axes.level))}</div>`;
  }

  return `<table>
    <thead><tr><th>Agent</th><th class="num">Safety</th><th>Readiness</th></tr></thead>
    <tbody>${latest.slice(0, 5).map((run) => `<tr>
      <td>${esc(run.agent.name.replace("reference-", ""))} <span class="mono faint">v${esc(run.agent.version)}</span></td>
      <td class="num">${run.axes.safety.score}</td>
      <td>${pill(run.axes.level, levelClass(run.axes.level))}</td>
    </tr>`).join("")}</tbody>
  </table>`;
}

async function loadRun(id) {
  state.run = await get(`/v1/lab/runs/${id}`);
  return state.run;
}

const views = {};

views.overview = async () => {
  const runs = visibleRuns();
  const latest = latestPerAgent(runs)[0];
  const [{ records } = {}, { outcomes } = {}, { qualifications } = {}] = await Promise.all([
    get("/v1/records"), get("/v1/outcomes"), get("/v1/qualifications"),
  ]);

  const byOutcome = {};
  for (const record of records ?? []) byOutcome[record.outcome] = (byOutcome[record.outcome] ?? 0) + 1;
  const unauthorized = (outcomes ?? []).filter((o) => o.status === "unauthorized").length;
  const live = (qualifications ?? []).filter((q) => !q.revokedAt && Date.parse(q.expiresAt) > Date.now());

  $("view-actions").innerHTML = `
    <button class="solid" data-act="gate-poisoned">Gate a poisoned invoice</button>
    <button data-act="run-careful">Run careful</button>
    <button data-act="send-clean">Send clean payment</button>`;

  $("view").innerHTML = `
    <div class="cards">
      <div class="card"><h2>Readiness</h2>${readinessCard(runs)}</div>

      <div class="card">
        <h2>Gate activity</h2>
        <div class="rows">
          <div class="r"><span class="k">Released</span><span class="v ok">${byOutcome.released ?? 0}</span></div>
          <div class="r"><span class="k">Held</span><span class="v bad">${byOutcome.held ?? 0}</span></div>
          <div class="r"><span class="k">Escalated</span><span class="v warn">${byOutcome.escalated ?? 0}</span></div>
          <div class="r"><span class="k">Settled while held</span><span class="v ${unauthorized ? "bad" : "ok"}">${unauthorized}</span></div>
        </div>
      </div>

      <div class="card">
        <h2>Qualifications in force</h2>
        <div class="metric sm">${live.length}</div>
        <div class="metric-label">
          not revoked, not expired · ${live.filter((q) => q.level.includes("autonomous")).length} carrying release authority
        </div>
        ${live.slice(0, 2).map((q) => `<div class="faint mono" style="margin-top:10px;font-size:11px">
          ${esc(q.binding.agent.name)} v${esc(q.binding.agent.version)} · to ${q.binding.amountLimit.toLocaleString()} ${esc(q.binding.currency)} · ${q.expiresAt.slice(0, 10)}
        </div>`).join("")}
      </div>

      <div class="card wide" id="gate-result" hidden></div>

      ${latest ? `<div class="card wide">
        <h2>Latest run <span class="plain">— ${esc(latest.agent.name)} v${esc(latest.agent.version)}</span></h2>
        ${ladderRow(latest.axes.level)}
        <div class="reason">${esc(latest.axes.levelReason)}</div>
        <div class="axes">
          ${axisBlock("Safety", latest.axes.safety)}
          ${axisBlock("Capability", latest.axes.capability)}
          ${axisBlock("Recovery", latest.axes.recovery)}
          ${axisBlock("Reliability", latest.axes.reliability)}
        </div>
      </div>` : ""}

      <div class="card wide">
        <h2>Recent decisions</h2>
        ${decisionTable((records ?? []).slice(-6).reverse())}
      </div>
    </div>`;
};

const decisionTable = (records) => records.length === 0
  ? `<div class="empty">No decisions yet.</div>`
  : `<table>
      <thead><tr><th>Time</th><th>Outcome</th><th>Payee</th><th class="num">Amount</th><th>Invoice</th><th>Why</th></tr></thead>
      <tbody>${records.map((r) => `<tr class="clickable" data-receipt="${r.id}">
        <td class="mono faint">${clock(r.createdAt)}</td>
        <td>${pill(r.outcome)}</td>
        <td>${esc(r.paymentOrder.payeeName)}<span class="faint mono"> ····${esc(r.paymentOrder.payeeAccountLast4)}</span></td>
        <td class="num">${money(r.paymentOrder.amount, r.paymentOrder.currency)}</td>
        <td class="mono">${esc(r.declaration.invoiceId)}</td>
        <td class="muted">${esc(r.reasons[0] ?? "")}</td>
      </tr>`).join("")}</tbody>
    </table>`;

views.decisions = async () => {
  const { records } = (await get("/v1/records")) ?? { records: [] };
  $("view-actions").innerHTML = `
    <button class="solid" data-act="gate-poisoned">Gate a poisoned invoice</button>
    <button data-act="send-clean">Send clean payment</button>
    <button data-act="send-altered">Send altered order</button>`;
  $("view").innerHTML = `
    <div class="cards">
      <div class="card wide" id="gate-result" hidden></div>
      <div class="card wide">
        <h2>All decisions <span class="plain">— click one for its receipt</span></h2>
        ${decisionTable([...(records ?? [])].reverse())}
      </div>
      <div class="card wide" id="receipt-card">
        <h2>Receipt</h2>
        <div class="empty">Select a decision to see the signed receipt and verify it here.</div>
      </div>
    </div>`;
};

async function showReceipt(decisionId) {
  const card = $("receipt-card") ?? $("view");
  const receipt = await get(`/v1/receipts/${decisionId}`);
  if (!receipt || receipt.error) return;
  const verification = await post("/v1/receipts/verify", receipt);
  card.innerHTML = `
    <h2>Receipt <span class="plain">— ${esc(receipt.receiptId)}</span></h2>
    <div class="rows" style="margin-bottom:14px">
      <div class="r"><span class="k">Signature</span><span class="v ${verification?.valid ? "ok" : "bad"}">${verification?.valid ? "verifies" : "invalid"}</span></div>
      <div class="r"><span class="k">Size</span><span class="v">${JSON.stringify(receipt).length} bytes</span></div>
      <div class="r"><span class="k">Checks recorded</span><span class="v">${receipt.checks.length}</span></div>
      <div class="r"><span class="k">Verifiable offline</span><span class="v ok">yes</span></div>
    </div>
    <pre>${esc(JSON.stringify(receipt, null, 2))}</pre>`;
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

views.outcomes = async () => {
  const { outcomes } = (await get("/v1/outcomes")) ?? { outcomes: [] };
  const counts = {};
  for (const o of outcomes ?? []) counts[o.status] = (counts[o.status] ?? 0) + 1;
  $("view-actions").innerHTML = "";
  $("view").innerHTML = `
    <div class="cards">
      <div class="card">
        <h2>Settled while held</h2>
        <div class="metric ${counts.unauthorized ? "bad" : "ok"}">${counts.unauthorized ?? 0}</div>
        <div class="metric-label">payments that moved without a release</div>
      </div>
      <div class="card">
        <h2>Verified</h2>
        <div class="metric ok">${counts.verified ?? 0}</div>
        <div class="metric-label">settled exactly as allowed</div>
      </div>
      <div class="card">
        <h2>Duplicate or mismatched</h2>
        <div class="metric ${(counts.duplicate ?? 0) + (counts.mismatch ?? 0) ? "warn" : ""}">${(counts.duplicate ?? 0) + (counts.mismatch ?? 0)}</div>
        <div class="metric-label">settled, but not as described</div>
      </div>
      <div class="card wide">
        <h2>Outcome records</h2>
        ${(outcomes ?? []).length === 0 ? `<div class="empty">No settlements reported yet.</div>` : `
        <table>
          <thead><tr><th>Status</th><th>Decision</th><th>Finding</th></tr></thead>
          <tbody>${[...outcomes].reverse().slice(0, 15).map((o) => `<tr>
            <td>${pill(o.status)}</td>
            <td class="mono">${esc(o.decisionId)}</td>
            <td class="muted">${esc(o.findings[0]?.detail ?? "as allowed")}</td>
          </tr>`).join("")}</tbody>
        </table>`}
      </div>
    </div>`;
};

views.runs = async () => {
  const runs = visibleRuns();
  $("view-actions").innerHTML = `
    <select class="inline" id="trials"><option value="1">1 trial</option><option value="3" selected>3 trials</option><option value="5">5 trials</option></select>
    <button class="solid" data-act="run-careful">Run careful</button>
    <button data-act="run-naive">Run naive</button>
    <button data-act="qualify">Run and qualify</button>`;

  if (runs.length === 0) {
    $("view").innerHTML = `<div class="card"><div class="empty">No runs for this agent yet.</div></div>`;
    return;
  }

  const run = state.run ?? (await loadRun(runs.at(-1).id));
  const criticals = new Map();
  for (const v of run.axes.criticalViolations) {
    const seen = criticals.get(v.code) ?? { count: 0, example: v };
    criticals.set(v.code, { count: seen.count + 1, example: seen.example });
  }

  $("view").innerHTML = `
    <div class="cards">
      <div class="card wide">
        <h2>${esc(run.agent.name)} v${esc(run.agent.version)}
          <span class="plain">— ${esc(run.suite.id)} ${esc(run.suite.version)}, ${run.suite.scenarioCount} scenarios × ${run.suite.trials} trials</span></h2>
        ${ladderRow(run.axes.level)}
        <div class="reason">${esc(run.axes.levelReason)}</div>
        <div class="axes">
          ${axisBlock("Safety", run.axes.safety)}
          ${axisBlock("Capability", run.axes.capability)}
          ${axisBlock("Recovery", run.axes.recovery)}
          ${axisBlock("Reliability", run.axes.reliability)}
        </div>
        <div class="faint mono" style="margin-top:16px;font-size:11px">
          ${esc(run.id)} · sealed ${when(run.createdAt)} ·
          signature ${run.verification?.ok ? '<span class="ok">verifies</span>' : '<span class="bad">broken</span>'}
        </div>
      </div>

      ${criticals.size === 0 ? "" : `<div class="card wide">
        <h2>Critical violations</h2>
        <table>
          <thead><tr><th>Code</th><th class="num">Count</th><th>Example</th></tr></thead>
          <tbody>${[...criticals.entries()].map(([code, { count, example }]) => `<tr>
            <td class="mono bad">${esc(code)}</td>
            <td class="num">${count}</td>
            <td class="muted">${esc(example.scenarioId)} — ${esc(example.detail)}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>`}

      <div class="card wide">
        <h2>Run history</h2>
        <table>
          <thead><tr><th>When</th><th>Agent</th><th>Suite</th><th class="num">Safety</th><th class="num">Capability</th><th class="num">Recovery</th><th class="num">Reliability</th><th>Level</th></tr></thead>
          <tbody>${[...runs].reverse().slice(0, 15).map((r) => `<tr class="clickable" data-run="${r.id}">
            <td class="mono faint">${when(r.createdAt)}</td>
            <td>${esc(r.agent.name)} <span class="mono faint">v${esc(r.agent.version)}</span></td>
            <td class="mono faint">${esc(r.suite.version)} ×${r.suite.trials}</td>
            <td class="num">${r.axes.safety.score}</td>
            <td class="num">${r.axes.capability.score}</td>
            <td class="num">${r.axes.recovery.score}</td>
            <td class="num">${r.axes.reliability?.score ?? "—"}</td>
            <td>${pill(r.axes.level, levelClass(r.axes.level))}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`;
};

views.scenarios = async () => {
  const runs = visibleRuns();
  if (runs.length === 0) {
    $("view").innerHTML = `<div class="card"><div class="empty">Run an agent to see per-scenario results.</div></div>`;
    return;
  }
  const run = state.run ?? (await loadRun(runs.at(-1).id));
  $("view-actions").innerHTML = `<span class="faint mono" style="font-size:11px">${esc(run.id)}</span>`;

  const byScenario = new Map();
  for (const grade of run.grades) byScenario.set(grade.scenarioId, [...(byScenario.get(grade.scenarioId) ?? []), grade]);

  $("view").innerHTML = `
    <div class="cards">
      <div class="card wide">
        <h2>${esc(run.agent.name)} v${esc(run.agent.version)} <span class="plain">— one dot per trial, click to replay</span></h2>
        <div class="matrix">${[...byScenario.entries()].map(([id, grades]) => {
          const meta = state.scenarios.find((s) => s.id === id);
          const critical = grades.some((g) => g.criticalCount > 0);
          return `<button class="cell ${critical ? "hasCritical" : ""}" data-scenario="${id}">
            <span class="id">${id}</span>
            <span class="dots">${grades.map((g) =>
              `<i class="${g.criticalCount > 0 ? "fail" : g.violations.length > 0 ? "soft" : ""}" title="trial ${g.trial}: ${g.effective}"></i>`).join("")}</span>
            <span class="ttl">${esc(meta?.title ?? "")}</span>
          </button>`;
        }).join("")}</div>
      </div>

      <div class="card wide">
        <h2>Scenario library <span class="plain">— ${state.scenarios.length} scenarios, with where each pattern comes from</span></h2>
        <table>
          <thead><tr><th>ID</th><th>Category</th><th>Title</th><th>Severity</th><th>Correct action</th><th>Source</th></tr></thead>
          <tbody>${state.scenarios.map((s) => `<tr>
            <td class="mono">${esc(s.id)}</td>
            <td class="muted">${esc(s.category)}</td>
            <td>${esc(s.title)}</td>
            <td class="${s.severity === "critical" ? "bad" : s.severity === "high" ? "warn" : "muted"}">${esc(s.severity)}</td>
            <td class="mono">${esc(s.expected)}</td>
            <td class="faint" style="font-size:11.5px">${esc(s.source)}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`;
};

views.trace = async () => {
  const runs = visibleRuns();
  if (runs.length === 0) {
    $("view").innerHTML = `<div class="card"><div class="empty">No runs yet.</div></div>`;
    return;
  }
  const run = state.run ?? (await loadRun(runs.at(-1).id));
  const ids = [...new Set(run.grades.map((g) => g.scenarioId))];
  const chosen = state.traceScenario ?? ids.find((id) => run.grades.some((g) => g.scenarioId === id && g.criticalCount > 0)) ?? ids[0];

  $("view-actions").innerHTML = `
    <select class="inline" id="scenario-pick">${ids.map((id) => {
      const meta = state.scenarios.find((s) => s.id === id);
      const failed = run.grades.some((g) => g.scenarioId === id && g.criticalCount > 0);
      return `<option value="${id}" ${id === chosen ? "selected" : ""}>${id}${failed ? " ⚠" : ""} — ${esc(meta?.title ?? "")}</option>`;
    }).join("")}</select>`;

  await renderTrace(run, chosen);
  $("scenario-pick")?.addEventListener("change", (e) => {
    state.traceScenario = e.target.value;
    renderTrace(run, e.target.value);
  });
};

async function renderTrace(run, scenarioId) {
  const meta = state.scenarios.find((s) => s.id === scenarioId);
  const { episodes } = (await get(`/v1/lab/episodes?runId=${run.id}&scenarioId=${scenarioId}`)) ?? { episodes: [] };
  const grades = run.grades.filter((g) => g.scenarioId === scenarioId);

  // Open the trial that went wrong. A clean trial of a scenario the agent
  // failed elsewhere is the least useful thing to put in front of someone.
  const grade = grades.find((g) => g.criticalCount > 0) ?? grades.find((g) => g.violations.length > 0) ?? grades[0];
  const episode = episodes.find((e) => e.episodeId === grade?.episodeId) ?? episodes[0];

  if (!episode) {
    $("view").innerHTML = `<div class="card"><div class="empty">No trace stored for ${esc(scenarioId)}.</div></div>`;
    return;
  }

  const anchored = new Map();
  for (const v of grade?.violations ?? []) {
    if (v.evidence) anchored.set(v.evidence.seq, [...(anchored.get(v.evidence.seq) ?? []), v]);
  }
  const loose = (grade?.violations ?? []).filter((v) => !v.evidence);

  $("view").innerHTML = `
    <div class="cards">
      <div class="card">
        <h2>Episode</h2>
        <div class="rows">
          <div class="r"><span class="k">Scenario</span><span class="v">${esc(scenarioId)}</span></div>

        </div>
        <div class="faint" style="font-size:11.5px;margin-top:12px">${esc(meta?.source ?? "")}</div>
      </div>

      <div class="card wide">
        <h2>Tool calls</h2>
        ${episode.calls.map((call) => {
          const findings = anchored.get(call.seq) ?? [];

            <div class="top"><span class="seq">${String(call.seq).padStart(2, "0")}</span><span class="tool">${esc(call.tool)}</span></div>
            <div class="args">${esc(JSON.stringify(call.args))}</div>
            <div class="res">→ ${esc(JSON.stringify(call.result).slice(0, 240))}</div>
            ${findings.map((f) => `<div class="finding">
              <span class="code">${esc(f.code)} · ${esc(f.severity)}</span><br>${esc(f.detail)}</div>`).join("")}
          </div>`;
        }).join("") || `<div class="empty">The agent made no tool calls.</div>`}
        ${episode.declared ? `<div class="muted" style="font-size:12.5px;margin-top:10px">
          Finished: <span class="mono">${esc(episode.declared.action)}</span> — ${esc(episode.declared.reason ?? "")}</div>` : ""}
        ${loose.map((f) => `<div class="finding" style="margin-top:10px">
          <span class="code">${esc(f.code)} · ${esc(f.severity)}</span><br>${esc(f.detail)}</div>`).join("")}
      </div>
    </div>`;
}

views.compare = async () => {
  const runs = state.runs;
  if (runs.length < 2) {
    $("view").innerHTML = `<div class="card"><div class="empty">Two runs are needed to compare.</div></div>`;
    return;
  }

  const latest = runs.at(-1);
  const sameSuite = runs.filter((r) => r.suite.version === latest.suite.version);
  const defaultB = state.compare.b ?? sameSuite.at(-1).id;
  const earlier = sameSuite.filter((r) => r.id !== defaultB && r.agent.name === latest.agent.name);
  const defaultA = state.compare.a ?? (earlier.find((r) => r.agent.version !== latest.agent.version) ?? earlier[0] ?? runs[0]).id;

  const option = (run, selected) =>
    `<option value="${run.id}" ${run.id === selected ? "selected" : ""}>${esc(run.agent.name)} v${esc(run.agent.version)} · ${esc(run.suite.version)} · ${when(run.createdAt)}</option>`;

  $("view-actions").innerHTML = `
    <select class="inline" id="pick-a">${runs.map((r) => option(r, defaultA)).join("")}</select>
    <span class="faint">vs</span>
    <select class="inline" id="pick-b">${runs.map((r) => option(r, defaultB)).join("")}</select>`;

  await renderCompare(defaultA, defaultB);
  for (const id of ["pick-a", "pick-b"]) {
    $(id)?.addEventListener("change", () => {
      state.compare = { a: $("pick-a").value, b: $("pick-b").value };
      renderCompare(state.compare.a, state.compare.b);
    });
  }
};

async function renderCompare(idA, idB) {
  const [a, b] = await Promise.all([get(`/v1/lab/runs/${idA}`), get(`/v1/lab/runs/${idB}`)]);
  if (!a || !b || a.error || b.error) {
    $("view").innerHTML = `<div class="card"><div class="empty">Could not load both runs.</div></div>`;
    return;
  }

  const rank = (run) => LADDER.indexOf(run.axes.level);
  const winner = rank(b) > rank(a) ? "b" : rank(a) > rank(b) ? "a" : null;

  const worst = (run, scenarioId) => {
    const grades = run.grades.filter((g) => g.scenarioId === scenarioId);
    if (grades.length === 0) return null;
    return grades.some((g) => g.criticalCount > 0) ? "critical"
      : grades.some((g) => g.violations.length > 0) ? "finding" : "clean";
  };
  const ids = [...new Set([...a.grades, ...b.grades].map((g) => g.scenarioId))];
  const changes = ids.map((id) => ({ id, from: worst(a, id), to: worst(b, id) })).filter((c) => c.from !== c.to);
  const fixed = changes.filter((c) => c.from === "critical" && c.to !== "critical");
  const broke = changes.filter((c) => c.to === "critical" && c.from !== "critical");

  const side = (run, key) => `
    <div class="side ${winner === key ? "winner" : ""}">
      <div class="who">
        <div>
          <div style="font-size:14.5px;font-weight:500">${esc(run.agent.name)} <span class="mono faint">v${esc(run.agent.version)}</span></div>
          <div class="faint" style="font-size:11.5px">suite ${esc(run.suite.version)} · ${run.suite.trials} trials · ${when(run.createdAt)}</div>
        </div>
        ${winner === key ? `<span class="badge">better</span>` : ""}
      </div>
      <div style="margin-bottom:12px">${pill(run.axes.level, levelClass(run.axes.level))}</div>
      <div class="rows">
        ${["safety", "capability", "recovery"].map((axis) => `
          <div class="r"><span class="k">${axis[0].toUpperCase()}${axis.slice(1)}</span><span class="v">${run.axes[axis].score}</span></div>`).join("")}
        <div class="r"><span class="k">Reliability</span><span class="v">${run.axes.reliability?.score ?? "—"}</span></div>
        <div class="r"><span class="k">Critical violations</span>
          <span class="v ${run.axes.criticalViolations.length ? "bad" : "ok"}">${run.axes.criticalViolations.length}</span></div>
      </div>
    </div>`;

  const deltaRow = (label, from, to) => {
    const change = to - from;
    return `<div class="r"><span class="k">${label}</span>
      <span class="v ${change > 0 ? "ok" : change < 0 ? "bad" : "muted"}">${from} → ${to}${change === 0 ? "" : ` (${change > 0 ? "+" : ""}${change})`}</span></div>`;
  };

  $("view").innerHTML = `
    <div class="cards">
      <div class="card wide"><h2>Side by side</h2><div class="versus">${side(a, "a")}${side(b, "b")}</div></div>

      <div class="card">
        <h2>Change</h2>
        <div class="rows">
          ${deltaRow("Safety", a.axes.safety.score, b.axes.safety.score)}
          ${deltaRow("Capability", a.axes.capability.score, b.axes.capability.score)}
          ${deltaRow("Recovery", a.axes.recovery.score, b.axes.recovery.score)}
          ${deltaRow("Critical violations", a.axes.criticalViolations.length, b.axes.criticalViolations.length)}
        </div>
        ${a.suite.version !== b.suite.version ? `<div class="warn" style="font-size:12.5px;margin-top:12px">
          These runs used different suite versions (${esc(a.suite.version)} and ${esc(b.suite.version)}), so the scores are not directly comparable.</div>` : ""}
      </div>

      <div class="card">
        <h2>Fixed and broken</h2>
        <div class="metric sm ${broke.length ? "bad" : "ok"}">${fixed.length} / ${broke.length}</div>
        <div class="metric-label">scenarios fixed / newly failing</div>
      </div>

      <div class="card wide">
        <h2>Scenario changes</h2>
        ${changes.length === 0 ? `<div class="empty">No scenario changed state between these runs.</div>` :
          changes.map((c) => {
            const meta = state.scenarios.find((s) => s.id === c.id);
            const better = c.from === "critical" || (c.from === "finding" && c.to === "clean");
            return `<div class="chg">
              <span class="tagmark ${better ? "ok" : "bad"}">${better ? "fixed" : "worse"}</span>
              <div>
                <div class="mono">${esc(c.id)} <span class="faint">${esc(meta?.title ?? "")}</span></div>
                <div class="muted" style="font-size:12.5px">${esc(c.from ?? "absent")} → ${esc(c.to ?? "absent")}</div>
              </div>
            </div>`;
          }).join("")}
      </div>
    </div>`;
}

// ---- actions ------------------------------------------------------------
const trials = () => Number($("trials")?.value ?? 3);

const QUALIFY_SCOPE = {
  workflow: "invoice-payment", rail: "ach", currency: "USD", amountLimit: 5000,
  approvalPolicy: "A person approves anything above the ceiling or off the vendor file.",
  payeeScope: "on-file",
};

/** Shows what happened at the bank, which is the part worth watching. */
function showGate(result) {
  const card = $("gate-result");
  if (!card || !result) return;
  const verdict = result.verdict?.verdict ?? "—";
  card.hidden = false;
  card.innerHTML = `
    <h2>At the bank</h2>
    <div class="rows">
      <div class="r"><span class="k">Verdict</span><span class="v">${pill(verdict)}</span></div>
      <div class="r"><span class="k">Transfer</span><span class="v">${esc(result.transfer?.id ?? "—")}</span></div>
      <div class="r"><span class="k">Status</span><span class="v">${esc(result.transfer?.statusBefore ?? "")} → <strong>${esc(result.transfer?.statusAfter ?? "")}</strong></span></div>
      <div class="r"><span class="k">Can still be stopped</span><span class="v ${result.transfer?.stoppable ? "warn" : "muted"}">${result.transfer?.stoppable ? "yes" : "no"}</span></div>
      <div class="r"><span class="k">Rail</span><span class="v">${esc(result.rail?.name ?? "")} (${esc(result.rail?.mode ?? "")})</span></div>
    </div>
    <div class="muted" style="font-size:13px;margin-top:12px">${esc(result.action ?? "")}</div>`;
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

const ACTIONS = {
  "run-careful": () => post("/v1/lab/runs", { agent: "careful", trials: trials() }),
  "run-naive": () => post("/v1/lab/runs", { agent: "naive", trials: trials() }),
  "qualify": () => post("/v1/lab/runs", { agent: "careful", trials: trials(), qualifyFor: QUALIFY_SCOPE }),
  "send-clean": () => post("/v1/decisions", { scenario: "clean" }),
  "send-altered": () => post("/v1/decisions", { scenario: "altered" }),
  "gate-poisoned": async () => showGate(await post("/v1/gate", { scenario: "poisoned" })),
  "new-key": async () => {
    const created = await post("/v1/keys", { name: `console ${new Date().toISOString().slice(0, 16)}`, environment: "test" });
    const card = $("new-key-card");
    if (created?.key && card) {
      card.hidden = false;
      card.innerHTML = `<h2>New key — shown once</h2><pre>${esc(created.key)}</pre>
        <div class="muted" style="font-size:12.5px;margin-top:10px">${esc(created.note ?? "")}</div>`;
    }
  },
};

document.addEventListener("click", async (event) => {
  const actionButton = event.target.closest("[data-act]");
  if (actionButton) {
    const action = ACTIONS[actionButton.dataset.act];
    if (!action) return;
    const label = actionButton.textContent;
    actionButton.disabled = true;
    actionButton.textContent = "Working…";
    let keepResult = null;
    try { keepResult = await action(); } finally {
      actionButton.textContent = label;
      actionButton.disabled = false;
      state.run = null;
      await refresh();
      // The gate panel is rebuilt by refresh, so paint it again afterwards.
      if (actionButton.dataset.act === "gate-poisoned" && keepResult) showGate(keepResult);
    }
    return;
  }

  const receiptRow = event.target.closest("[data-receipt]");
  if (receiptRow) return showReceipt(receiptRow.dataset.receipt);

  const runRow = event.target.closest("[data-run]");
  if (runRow) { await loadRun(runRow.dataset.run); return render(); }

  const scenarioCell = event.target.closest("[data-scenario]");
  if (scenarioCell) { state.traceScenario = scenarioCell.dataset.scenario; location.hash = "#/trace"; }
});

// ---- routing ------------------------------------------------------------
const currentView = () => location.hash.replace("#/", "") || "overview";

async function render() {
  const id = currentView();
  setActive(id);
  $("view-actions").innerHTML = "";
  const view = views[id] ?? views.overview;
  $("view").innerHTML = `<div class="card"><div class="empty">Loading…</div></div>`;
  await view();
}

async function loadRail() {
  const rail = await get("/v1/rails/status");
  if (!rail) return;
  $("rail-chip").className = `chip ${rail.live ? "live" : ""}`;
  $("rail-chip").title = rail.note ?? "";
  $("rail-label").textContent = rail.live ? `${rail.rail} · ${rail.mode}` : "simulated rail";
}

async function refresh() {
  const [{ runs } = {}, scenarios] = await Promise.all([get("/v1/lab/runs"), get("/v1/bench/scenarios")]);
  state.runs = runs ?? [];
  state.scenarios = Array.isArray(scenarios) ? scenarios : [];

  const agents = [...new Set(state.runs.map((r) => r.agent.name))];
  const filter = $("agent-filter");
  const keep = state.agent;
  filter.innerHTML = `<option value="all">All agents</option>${agents.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join("")}`;
  filter.value = agents.includes(keep) ? keep : "all";
  state.agent = filter.value;

  await render();
}

$("agent-filter").addEventListener("change", (e) => { state.agent = e.target.value; state.run = null; render(); });
window.addEventListener("hashchange", render);

renderNav();
loadRail();
refresh();
</script>
