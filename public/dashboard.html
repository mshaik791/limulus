<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limulus</title>
<style>
  :root{
    --paper:#F2F4F3;--surface:#fff;--ink:#141A21;--muted:#59636F;--rule:#D6DBDF;
    --accent:#1F4AA8;--pass:#1C7349;--fail:#B0261B;--warn:#8F6200;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#0C1016;--surface:#141A23;--ink:#E5E9EF;--muted:#96A0AD;--rule:#252E3A;
      --accent:#93AAFF;--pass:#5FC392;--fail:#F2806F;--warn:#E2B455}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:20px}
  h1{font-size:18px;letter-spacing:.16em;margin:0}
  .tagline{color:var(--muted);font-size:13px;margin-top:2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:7px 13px;border-radius:5px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);cursor:pointer}
  button.solid{background:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
  section.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:15px 17px}
  section.panel.wide{grid-column:1/-1}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--rule)}
  td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .mono{font-family:var(--mono);font-size:12px}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
  .released,.verified,.ok{color:var(--pass)}
  .held,.unauthorized,.duplicate,.mismatch,.bad{color:var(--fail)}
  .escalated,.returned,.warn{color:var(--warn)}
  .unsettled,.muted{color:var(--muted)}
  .stat{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px}
  .stat div{min-width:86px}
  .stat .n{font-size:26px;font-family:var(--mono);line-height:1.1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:7px}
  .bar span{display:block;height:100%;background:var(--accent)}
  .spark{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:6px}
  .spark i{flex:1;background:var(--accent);border-radius:1px 1px 0 0;min-height:2px;opacity:.85}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .row-actions{display:flex;gap:6px}
  .row-actions button{padding:3px 8px;font-size:11.5px}
  pre{font-family:var(--mono);font-size:11px;line-height:1.45;background:var(--paper);border:1px solid var(--rule);
    border-radius:6px;padding:11px;overflow:auto;max-height:260px;margin:0}
  .foot{color:var(--muted);font-size:12px;margin-top:22px;border-top:1px solid var(--rule);padding-top:12px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>LIMULUS</h1>
      <div class="tagline">Proof before the money moves. Pre-product demo, example data.</div>
    </div>
    <div class="controls">
      <button class="solid" id="run-careful">Test careful agent</button>
      <button id="run-naive">Test naive agent</button>
      <button id="decide-clean">Send clean payment</button>
      <button id="decide-poisoned">Send poisoned invoice</button>
      <button id="refresh">Refresh</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel wide">
      <h2>Agent readiness</h2>
      <div id="agents"></div>
    </section>

    <section class="panel">
      <h2>Score over time</h2>
      <div id="trend"></div>
    </section>

    <section class="panel">
      <h2>Outcomes</h2>
      <div id="outcomes"></div>
    </section>

    <section class="panel wide">
      <h2>Recent decisions</h2>
      <div id="decisions"></div>
    </section>

    <section class="panel wide">
      <h2>Receipt</h2>
      <div id="receipt"><div class="empty">Select a decision above to see its signed receipt.</div></div>
    </section>
  </div>

  <div class="foot">
    Verify any receipt at <a href="/verify.html">/verify.html</a>, or offline with
    <span class="mono">node src/verify-receipt.ts receipt.json</span>.
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const get = (path) => fetch(path).then((r) => r.json());
const post = (path, body) =>
  fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

const pct = (n) => `${(n * 100).toFixed(1)}%`;
const money = (a, c) => `${c} ${a.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const tag = (value) => `<span class="tag ${value}">${value}</span>`;

async function loadAgents() {
  const { agents } = await get("/v1/bench/agents");
  if (agents.length === 0) {
    $("agents").innerHTML = `<div class="empty">No test runs yet. Use the buttons above.</div>`;
    return;
  }
  $("agents").innerHTML = `
    <table>
      <thead><tr><th>Agent</th><th>Version</th><th>Score</th><th>Readiness</th><th>Wrong allows</th><th>Friction</th><th>Runs</th><th>Change</th></tr></thead>
      <tbody>
        ${agents.map((a) => {
          const m = a.latest.matrix ?? { wrongAllow: 0, wrongAllowRate: 0, frictionRate: 0, correctAllow: 0 };
          const delta = a.scoreDelta === null ? "first run" : `${a.scoreDelta >= 0 ? "+" : ""}${a.scoreDelta}`;
          const deltaClass = a.scoreDelta === null ? "muted" : a.scoreDelta >= 0 ? "ok" : "bad";
          return `<tr>
            <td>${a.agent}</td>
            <td class="mono">${a.latest.version ?? "-"}</td>
            <td><strong>${a.latest.score}</strong>/100<div class="bar"><span style="width:${a.latest.score}%"></span></div></td>
            <td>${tag(a.latest.level.replace(/ /g, "-"))}</td>
            <td class="${m.wrongAllowRate > 0 ? "bad" : "ok"}">${m.wrongAllow} of ${m.correctAllow + m.wrongAllow} (${pct(m.wrongAllowRate)})</td>
            <td class="${m.frictionRate > 0.2 ? "warn" : "muted"}">${pct(m.frictionRate)}</td>
            <td class="mono">${a.runs}</td>
            <td class="${deltaClass}">${delta}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
}

async function loadTrend() {
  const { history } = await get("/v1/bench/history");
  if (history.length === 0) {
    $("trend").innerHTML = `<div class="empty">Run a test to see the trend.</div>`;
    return;
  }
  const recent = history.slice(-24);
  $("trend").innerHTML = `
    <div class="stat">
      <div><div class="n">${recent.at(-1).score}</div><div class="l">latest score</div></div>
      <div><div class="n">${pct(recent.at(-1).wrongAllowRate)}</div><div class="l">wrong allows</div></div>
      <div><div class="n">${history.length}</div><div class="l">runs recorded</div></div>
    </div>
    <div class="spark">${recent.map((h) => `<i style="height:${Math.max(4, h.score)}%" title="${h.score}/100 on ${time(h.createdAt)}"></i>`).join("")}</div>`;
}

async function loadOutcomes() {
  const { outcomes } = await get("/v1/outcomes");
  if (outcomes.length === 0) {
    $("outcomes").innerHTML = `<div class="empty">No settlements reported yet.</div>`;
    return;
  }
  const counts = {};
  for (const o of outcomes) counts[o.status] = (counts[o.status] ?? 0) + 1;
  const unauthorized = counts.unauthorized ?? 0;
  $("outcomes").innerHTML = `
    <div class="stat">
      <div><div class="n ${unauthorized ? "bad" : "ok"}">${unauthorized}</div><div class="l">settled while held</div></div>
      <div><div class="n">${counts.verified ?? 0}</div><div class="l">verified</div></div>
      <div><div class="n">${(counts.duplicate ?? 0) + (counts.mismatch ?? 0)}</div><div class="l">duplicate or mismatch</div></div>
    </div>
    <table>
      <tbody>
        ${outcomes.slice(-6).reverse().map((o) => `<tr>
          <td>${tag(o.status)}</td>
          <td class="mono">${o.decisionId.slice(0, 12)}</td>
          <td class="muted">${o.findings[0]?.detail ?? ""}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}

async function loadDecisions() {
  const { records } = await get("/v1/records");
  if (!records || records.length === 0) {
    $("decisions").innerHTML = `<div class="empty">No decisions yet.</div>`;
    return;
  }
  $("decisions").innerHTML = `
    <table>
      <thead><tr><th>Time</th><th>Decision</th><th>Payee</th><th>Amount</th><th>Invoice</th><th>Why</th><th></th></tr></thead>
      <tbody>
        ${records.slice(-8).reverse().map((r) => `<tr>
          <td class="mono muted">${time(r.createdAt)}</td>
          <td>${tag(r.outcome)}</td>
          <td>${r.paymentOrder.payeeName}<span class="muted mono"> ****${r.paymentOrder.payeeAccountLast4}</span></td>
          <td class="mono">${money(r.paymentOrder.amount, r.paymentOrder.currency)}</td>
          <td class="mono">${r.declaration.invoiceId}</td>
          <td class="muted">${r.reasons[0] ?? ""}</td>
          <td class="row-actions"><button data-receipt="${r.id}">Receipt</button></td>
        </tr>`).join("")}
      </tbody>
    </table>`;

  for (const button of document.querySelectorAll("[data-receipt]")) {
    button.addEventListener("click", () => showReceipt(button.dataset.receipt));
  }
}

async function showReceipt(decisionId) {
  const receipt = await get(`/v1/receipts/${decisionId}`);
  const verification = await post("/v1/receipts/verify", receipt);
  $("receipt").innerHTML = `
    <div class="stat">
      <div><div class="n ${verification.valid ? "ok" : "bad"}">${verification.valid ? "valid" : "invalid"}</div><div class="l">signature</div></div>
      <div><div class="n">${JSON.stringify(receipt).length}</div><div class="l">bytes</div></div>
      <div><div class="n">${receipt.checks.length}</div><div class="l">checks recorded</div></div>
    </div>
    <pre>${JSON.stringify(receipt, null, 2).replace(/</g, "&lt;")}</pre>`;
}

async function refresh() {
  await Promise.all([loadAgents(), loadTrend(), loadOutcomes(), loadDecisions()]);
}

async function withBusy(button, work) {
  button.disabled = true;
  const label = button.textContent;
  button.textContent = "Running...";
  try { await work(); } finally {
    button.textContent = label;
    button.disabled = false;
    await refresh();
  }
}

$("run-careful").addEventListener("click", (e) => withBusy(e.target, () => post("/v1/bench/runs", { agent: "careful" })));
$("run-naive").addEventListener("click", (e) => withBusy(e.target, () => post("/v1/bench/runs", { agent: "naive" })));
$("decide-clean").addEventListener("click", (e) => withBusy(e.target, () => post("/v1/decisions", { scenario: "clean" })));
$("decide-poisoned").addEventListener("click", (e) => withBusy(e.target, () => post("/v1/decisions", { scenario: "poisoned" })));
$("refresh").addEventListener("click", refresh);

refresh();
</script>
</body>
</html>
